[package]
name = "chembank"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }
# build.rs 用它读取 Cargo 实际链接的 CPython 版本，校验与随包分发的运行时一致。
pyo3-build-config = "0.29.2"

[dependencies]
tauri = { version = "1", features = [ "dialog-confirm", "path-all", "fs-read-file", "dialog-message", "dialog-save", "dialog-open", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "1.0.5", features = ["tauri", "typescript"] }
sea-orm = { version = "1.1.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
tokio = { version = "1.43.0", features = ["full"] }
tauri-specta = { version = "1.0.2", features = ["javascript", "typescript"] }
entities = { path = "./entities" }
sea-schema = "0.16.1"
csv = "1.3.1"
skip_bom = "0.5.1"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[workspace]
members = ["entities"]
